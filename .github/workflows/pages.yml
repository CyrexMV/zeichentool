name: Zeichentool bauen (Web + APK) & veröffentlichen

# 1. Baut die Rust/WebAssembly-App
# 2. Packt sie in eine Android-APK (android/)
# 3. Legt Web-App + zeichentool.apk auf den Branch `gh-pages` (GitHub Pages)
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen installieren
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Tests
        run: cargo test
      - name: Web-App bauen
        run: ./build.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: APK bauen
        working-directory: android
        env:
          # Optional: eigener Signaturschlüssel über Repository-Secrets
          ZT_KEYSTORE_B64: ${{ secrets.ZT_KEYSTORE_B64 }}
          ZT_KEYSTORE_PASSWORD: ${{ secrets.ZT_KEYSTORE_PASSWORD }}
          ZT_KEY_ALIAS: ${{ secrets.ZT_KEY_ALIAS }}
          ZT_KEY_PASSWORD: ${{ secrets.ZT_KEY_PASSWORD }}
        run: |
          if [ -n "$ZT_KEYSTORE_B64" ]; then
            echo "$ZT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ZT_KEYSTORE="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Kein Signatur-Secret (ZT_KEYSTORE_B64) gesetzt – APK wird mit temporärem Debug-Schlüssel signiert. Updates erfordern dann eine Neuinstallation."
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../web/zeichentool.apk
          ls -la ../web/zeichentool.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zeichentool-apk
          path: web/zeichentool.apk

      - name: Auf gh-pages veröffentlichen
        run: |
          cd web
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Veröffentlichung von ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
