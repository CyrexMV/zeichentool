name: Zeichentool bauen & auf GitHub Pages veröffentlichen

# Baut die Rust/WebAssembly-App und legt das Ergebnis auf den Branch `gh-pages`,
# den GitHub Pages ausliefert (Settings → Pages → Deploy from a branch → gh-pages / root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: wasm-bindgen installieren
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Tests
        run: cargo test
      - name: Bauen
        run: ./build.sh
      - name: Auf gh-pages veröffentlichen
        run: |
          cd web
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Veröffentlichung von ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
